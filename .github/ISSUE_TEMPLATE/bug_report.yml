name: 버그 보고
description: 재현 가능한 Frostline Studio 문제를 알려 주세요.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        신고 전에 기존 issue를 검색해 주세요. 개인 사진, 토큰, 쿠키, 계정 데이터와 `.codex` 내용은 올리지 마세요.
  - type: input
    id: version
    attributes:
      label: Frostline Studio 버전
      placeholder: 예: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: Windows와 Node.js 버전을 적어 주세요.
      placeholder: 예: Windows 11 24H2, Node.js 24.19.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      placeholder: |
        1. 앱을 실행합니다.
        2. ...
        3. 문제가 발생합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 정리한 로그 또는 공개 가능한 예시
      description: 민감한 값과 개인 경로를 제거한 최소 정보만 적어 주세요.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 공개 정보 확인
      options:
        - label: 개인 사진, 비밀번호, 토큰, 쿠키, 계정·채팅 데이터를 포함하지 않았습니다.
          required: true
        - label: 기존 issue에서 같은 문제를 찾지 못했습니다.
          required: true
