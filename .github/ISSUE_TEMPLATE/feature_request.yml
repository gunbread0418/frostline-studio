name: 기능 제안
description: 안전 경계 안에서 새로운 기능이나 개선을 제안해 주세요.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 목록보다 사용자가 겪는 문제를 먼저 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
  - type: checkboxes
    id: boundary
    attributes:
      label: 안전 경계 확인
      options:
        - label: Codex 강제 종료, 반복 재시작, 패키지 수정, 내부 파일 접근을 요구하지 않습니다.
          required: true
        - label: 공식 연동을 제안한다면 공식 문서와 복원 방법을 함께 제시하겠습니다.
          required: true
        - label: 개인 사진이나 계정 데이터를 예시로 첨부하지 않았습니다.
          required: true
