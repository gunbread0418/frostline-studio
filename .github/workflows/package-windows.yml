name: Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run lint
          npm test

      - name: Build and verify Windows installer
        run: npm run package:win

      - name: Upload unsigned installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frostline-studio-windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
